version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clymex_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DEMO_MODE=true
      - SECRET_KEY=clymex-ai-super-secure-jwt-secret-key-2026-incomati-resilience
      - DATABASE_URL=postgresql://clymex:clymex2026@db:5432/clymex_risk
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clymex_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  db:
    image: postgis/postgis:16-3.4
    container_name: clymex_postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=clymex
      - POSTGRES_PASSWORD=clymex2026
      - POSTGRES_DB=clymex_risk
    volumes:
      - clymex_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clymex_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  clymex_pgdata:
